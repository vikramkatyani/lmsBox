<div class="lmsbox-interactive-block" data-block-id="{{BLOCK_ID}}" data-block-type="video" data-player-kind="{{PLAYER_KIND}}" role="region" aria-label="Lesson video">

  <div class="lmsbox-video">
    <div class="lmsbox-video__header">
      <p class="lmsbox-video__kicker">Video</p>
      <h2 class="lmsbox-video__title">{{TITLE}}</h2>
    </div>
    <div class="lmsbox-video__player-wrap">
      {{PLAYER_HTML}}
    </div>
    <div class="lmsbox-video__footer">
      <p class="lmsbox-video__description">{{DESCRIPTION}}</p>
      <p class="lmsbox-video__status" data-video-status aria-live="polite">Watch the full video to continue.</p>
      <button type="button" class="lmsbox-video__continue" data-video-continue>Mark video complete</button>
    </div>
  </div>

  <script>
  (function () {
    var root = document.querySelector('.lmsbox-interactive-block[data-block-type="video"][data-block-id="{{BLOCK_ID}}"]');
    if (!root || root.getAttribute('data-video-ready') === '1') return;
    root.setAttribute('data-video-ready', '1');

    var blockId = root.getAttribute('data-block-id');
    var playerKind = root.getAttribute('data-player-kind') || 'file';
    var filePlayer = root.querySelector('[data-video-player]');
    var embedPlayer = root.querySelector('[data-video-embed]');
    var statusEl = root.querySelector('[data-video-status]');
    var continueBtn = root.querySelector('[data-video-continue]');
    var completed = false;

    function notifyComplete() {
      if (completed) return;
      completed = true;
      if (statusEl) statusEl.textContent = 'Video complete';
      if (continueBtn) continueBtn.classList.remove('is-visible');
      var payload = { type: 'interactive-block-complete', blockId: Number(blockId) };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      if (window.lmsboxInteractive && typeof window.lmsboxInteractive.notifyComplete === 'function') {
        window.lmsboxInteractive.notifyComplete(Number(blockId));
      }
    }

    function reportHeight() {
      if (window.parent && window.parent !== window) {
        var height = Math.ceil(root.getBoundingClientRect().height);
        if (height > 0) {
          window.parent.postMessage({ type: 'interactive-block-resize', height: height }, '*');
        }
      }
    }

    if (continueBtn) {
      continueBtn.addEventListener('click', notifyComplete);
    }

    if (filePlayer) {
      filePlayer.addEventListener('loadedmetadata', reportHeight);
      filePlayer.addEventListener('error', function () {
        if (statusEl) {
          statusEl.textContent = 'Video failed to load. Check the URL or try uploading again.';
        }
        if (continueBtn) continueBtn.classList.add('is-visible');
        reportHeight();
      });
      filePlayer.addEventListener('ended', notifyComplete);
      filePlayer.addEventListener('timeupdate', function () {
        if (!filePlayer.duration || !isFinite(filePlayer.duration)) return;
        if (filePlayer.currentTime >= filePlayer.duration - 0.4) {
          notifyComplete();
        }
      });
      reportHeight();
      return;
    }

    if (embedPlayer) {
      if (continueBtn) {
        continueBtn.classList.add('is-visible');
        if (statusEl) {
          statusEl.textContent = playerKind === 'youtube' || playerKind === 'vimeo'
            ? 'Watch the video, then mark it complete to continue.'
            : 'Watch the full video to continue.';
        }
      }

      window.addEventListener('message', function (event) {
        if (completed) return;
        var data = event.data;
        try {
          if (typeof data === 'string') data = JSON.parse(data);
        } catch (e) {
          return;
        }
        if (!data || typeof data !== 'object') return;

        if (playerKind === 'youtube') {
          if (data.event === 'onStateChange' && (data.info === 0 || data.info === '0')) {
            notifyComplete();
          }
          return;
        }

        if (playerKind === 'vimeo') {
          if (data.event === 'ended' || data.event === 'finish') {
            notifyComplete();
          }
        }
      });

      if (playerKind === 'youtube') {
        function bindYoutube() {
          try {
            if (embedPlayer.contentWindow) {
              embedPlayer.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: blockId }), '*');
            }
          } catch (e) { /* ignore */ }
        }
        embedPlayer.addEventListener('load', bindYoutube);
        setTimeout(bindYoutube, 800);
      }

      reportHeight();
    }
  })();
  </script>
</div>
