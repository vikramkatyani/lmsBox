<div class="lmsbox-interactive-block" data-block-id="{{BLOCK_ID}}" data-block-type="accordion" role="region" aria-label="Lesson accordion">

  <p class="lmsbox-accordion__progress" data-accordion-progress aria-live="polite"></p>
  <div class="lms-accordion" data-accordion-root>
    {{PANELS_HTML}}
  </div>

  <script>
  (function () {
    var root = document.querySelector('.lmsbox-interactive-block[data-block-type="accordion"][data-block-id="{{BLOCK_ID}}"]');
    if (!root || root.getAttribute('data-accordion-ready') === '1') return;
    root.setAttribute('data-accordion-ready', '1');

    var blockId = root.getAttribute('data-block-id');
    var items = Array.prototype.slice.call(root.querySelectorAll('[data-accordion-item]'));
    var progressEl = root.querySelector('[data-accordion-progress]');
    if (items.length === 0) return;

    var expanded = {};
    var completed = false;

    function notifyComplete() {
      if (completed) return;
      completed = true;
      var payload = { type: 'interactive-block-complete', blockId: Number(blockId) };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      if (window.lmsboxInteractive && typeof window.lmsboxInteractive.notifyComplete === 'function') {
        window.lmsboxInteractive.notifyComplete(Number(blockId));
      }
    }

    function updateProgress() {
      var count = 0;
      for (var i = 0; i < items.length; i++) if (expanded[i]) count++;
      if (progressEl) progressEl.textContent = count + ' of ' + items.length + ' sections opened';
      if (count === items.length) notifyComplete();
    }

    function setOpen(item, open) {
      var trigger = item.querySelector('.lms-accordion__trigger');
      var body = item.querySelector('.lms-accordion__body');
      item.classList.toggle('is-open', open);
      if (trigger) trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (body) body.style.maxHeight = open ? body.scrollHeight + 'px' : '0px';
    }

    items.forEach(function (item, index) {
      var trigger = item.querySelector('.lms-accordion__trigger');
      if (!trigger) return;

      trigger.addEventListener('click', function () {
        var open = item.classList.contains('is-open');

        // Exclusive open: one section at a time.
        items.forEach(function (other) {
          if (other !== item) setOpen(other, false);
        });
        setOpen(item, !open);

        if (!open) {
          expanded[index] = true;
          updateProgress();
        }
      });
    });

    window.addEventListener('resize', function () {
      items.forEach(function (item) {
        if (!item.classList.contains('is-open')) return;
        var body = item.querySelector('.lms-accordion__body');
        if (body) body.style.maxHeight = body.scrollHeight + 'px';
      });
    });

    updateProgress();
  })();
  </script>
</div>
