<div class="lmsbox-interactive-block" data-block-id="{{BLOCK_ID}}" data-block-type="questionnaire" role="region" aria-label="Lesson questionnaire">

  <p class="lms-caption lmsbox-quiz-progress" data-quiz-progress aria-live="polite"></p>
  <div class="lms-stack lms-stack--lg" data-quiz-root></div>

  <script type="application/json" id="lmsbox-questionnaire-data-{{BLOCK_ID}}">{{QUESTIONNAIRE_JSON}}</script>
  <script>
  (function () {
    var root = document.querySelector('.lmsbox-interactive-block[data-block-type="questionnaire"][data-block-id="{{BLOCK_ID}}"]');
    if (!root || root.getAttribute('data-questionnaire-ready') === '1') return;
    root.setAttribute('data-questionnaire-ready', '1');

    var blockId = root.getAttribute('data-block-id');
    var dataEl = document.getElementById('lmsbox-questionnaire-data-{{BLOCK_ID}}');
    var config = { showFeedbackPerQuestion: true, questions: [] };
    try { config = JSON.parse(dataEl ? dataEl.textContent : '{}') || config; } catch (e) {}
    var questions = Array.isArray(config.questions) ? config.questions : [];
    var showFeedback = !!config.showFeedbackPerQuestion;
    if (!questions.length) return;

    var listEl = root.querySelector('[data-quiz-root]');
    var progressEl = root.querySelector('[data-quiz-progress]');
    var answered = {};
    var completed = false;
    var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

    var MENTOR_SVG =
      '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';

    function notifyComplete() {
      if (completed) return;
      completed = true;
      var payload = { type: 'interactive-block-complete', blockId: Number(blockId) };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      if (window.lmsboxInteractive && typeof window.lmsboxInteractive.notifyComplete === 'function') {
        window.lmsboxInteractive.notifyComplete(Number(blockId));
      }
    }

    function updateProgress() {
      var count = 0;
      for (var i = 0; i < questions.length; i++) if (answered[i]) count++;
      if (progressEl) {
        progressEl.textContent = count + ' of ' + questions.length + ' answered';
      }
      if (count === questions.length) notifyComplete();
    }

    function markAnswered(index) {
      answered[index] = true;
      updateProgress();
    }

    function isChoiceCorrect(question, selectedIndexes) {
      var options = question.options || [];
      var correct = [];
      for (var i = 0; i < options.length; i++) {
        if (options[i] && options[i].isCorrect) correct.push(i);
      }
      if (!correct.length) return null;
      if (selectedIndexes.length !== correct.length) return false;
      selectedIndexes = selectedIndexes.slice().sort(function (a, b) { return a - b; });
      correct.sort(function (a, b) { return a - b; });
      for (var j = 0; j < correct.length; j++) {
        if (selectedIndexes[j] !== correct[j]) return false;
      }
      return true;
    }

    function setFeedback(feedback, ok, title, message) {
      if (!feedback) return;
      var label = feedback.querySelector('.lms-question__feedback-label');
      var titleEl = feedback.querySelector('[data-fb-title]');
      var textEl = feedback.querySelector('[data-fb-text]');
      if (label) label.textContent = ok ? "That's right" : "Let's look at that again";
      if (titleEl) titleEl.textContent = title || (ok ? 'Correct' : 'Not quite');
      if (textEl) textEl.textContent = message || '';
      feedback.setAttribute('data-correct', String(!!ok));
      feedback.classList.add('is-on');
      feedback.hidden = false;
    }

    function hideFeedback(feedback) {
      if (!feedback) return;
      feedback.classList.remove('is-on');
      feedback.hidden = true;
      feedback.removeAttribute('data-correct');
    }

    function createFeedbackEl() {
      var feedback = document.createElement('div');
      feedback.className = 'lms-question__feedback';
      feedback.setAttribute('role', 'status');
      feedback.setAttribute('aria-live', 'polite');
      feedback.hidden = true;
      feedback.innerHTML =
        '<div class="lms-question__feedback-label">Feedback</div>' +
        '<h3 data-fb-title></h3>' +
        '<p data-fb-text></p>';
      return feedback;
    }

    function createQuestionShell(qIndex, metaName) {
      var section = document.createElement('section');
      section.className = 'lms-question';
      section.setAttribute('data-quiz-item', String(qIndex));

      var head = document.createElement('div');
      head.className = 'lms-question__head';
      head.innerHTML =
        '<span class="lms-question__mentor" aria-hidden="true">' + MENTOR_SVG + '</span>' +
        '<div>' +
          '<div class="lms-question__meta-label">Knowledge check</div>' +
          '<div class="lms-question__meta-name">' + metaName + '</div>' +
        '</div>';

      var body = document.createElement('div');
      body.className = 'lms-question__body';

      section.appendChild(head);
      section.appendChild(body);
      return { section: section, body: body };
    }

    function lockOptions(optionButtons, selectedIndexes, correctIndexes) {
      optionButtons.forEach(function (btn, index) {
        btn.disabled = true;
        var isSelected = selectedIndexes.indexOf(index) !== -1;
        var isCorrect = correctIndexes.indexOf(index) !== -1;
        if (isSelected) {
          btn.setAttribute('data-state', 'chosen');
        } else if (isCorrect) {
          btn.setAttribute('data-state', 'best');
        } else {
          btn.classList.add('is-dim');
        }
      });
    }

    questions.forEach(function (question, qIndex) {
      var type = (question.type || 'single').toLowerCase();
      var metaName = questions.length === 1 ? 'Quick check' : ('Question ' + (qIndex + 1));
      var shell = createQuestionShell(qIndex, metaName);
      var body = shell.body;

      var prompt = document.createElement('p');
      prompt.className = 'lms-question__prompt';
      prompt.textContent = question.text || '';
      body.appendChild(prompt);

      var feedback = createFeedbackEl();

      if (type === 'text') {
        var fieldId = 'lmsbox-quiz-text-{{BLOCK_ID}}-' + qIndex;
        var label = document.createElement('label');
        label.className = 'lms-sr';
        label.setAttribute('for', fieldId);
        label.textContent = 'Your answer';

        var textarea = document.createElement('textarea');
        textarea.id = fieldId;
        textarea.className = 'lms-question__text';
        textarea.setAttribute('aria-label', 'Answer for question ' + (qIndex + 1));
        textarea.placeholder = 'Write a few lines in your own words\u2026';

        body.appendChild(label);
        body.appendChild(textarea);

        if (showFeedback) {
          var actions = document.createElement('div');
          actions.className = 'lms-question__actions';
          var saveBtn = document.createElement('button');
          saveBtn.type = 'button';
          saveBtn.className = 'lms-button lms-button--primary';
          saveBtn.textContent = 'Save answer';
          saveBtn.addEventListener('click', function () {
            if (!textarea.value.trim()) {
              setFeedback(feedback, false, 'Answer needed', 'Please enter an answer before saving.');
              return;
            }
            markAnswered(qIndex);
            saveBtn.disabled = true;
            textarea.readOnly = true;
            setFeedback(feedback, true, 'Answer saved', 'Your response has been recorded.');
          });
          actions.appendChild(saveBtn);
          body.appendChild(actions);
        } else {
          textarea.addEventListener('input', function () {
            if (textarea.value.trim()) markAnswered(qIndex);
          });
        }

        body.appendChild(feedback);
      } else {
        var options = question.options || [];
        var optionsEl = document.createElement('div');
        optionsEl.className = 'lms-question__options';
        var optionButtons = [];
        var selected = {};
        var locked = false;

        var correctIndexes = [];
        options.forEach(function (option, oIndex) {
          if (option && option.isCorrect) correctIndexes.push(oIndex);
        });

        options.forEach(function (option, oIndex) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'lms-question__option';
          btn.setAttribute('data-correct', option && option.isCorrect ? 'true' : 'false');
          btn.setAttribute('aria-pressed', 'false');

          var key = document.createElement('span');
          key.className = 'lms-question__key';
          key.textContent = LETTERS.charAt(oIndex) || String(oIndex + 1);

          var text = document.createElement('span');
          text.textContent = (option && option.text) || '';

          btn.appendChild(key);
          btn.appendChild(text);
          optionsEl.appendChild(btn);
          optionButtons.push(btn);

          btn.addEventListener('click', function () {
            if (locked) return;

            if (type === 'single') {
              locked = true;
              selected = {};
              selected[oIndex] = true;
              var picked = [oIndex];
              var ok = isChoiceCorrect(question, picked);
              markAnswered(qIndex);

              if (showFeedback) {
                lockOptions(optionButtons, picked, correctIndexes);
                if (ok === null) {
                  setFeedback(feedback, true, 'Answer recorded', 'Your selection has been saved.');
                } else if (ok) {
                  setFeedback(feedback, true, 'Correct', 'Well done — that is the right answer.');
                } else {
                  setFeedback(feedback, false, 'Not quite', 'Review the highlighted option and try to remember it for next time.');
                }
              } else {
                optionButtons.forEach(function (other, idx) {
                  other.disabled = true;
                  if (idx === oIndex) other.setAttribute('data-state', 'chosen');
                  else other.classList.add('is-dim');
                });
                hideFeedback(feedback);
              }
              return;
            }

            // multiple choice — toggle selection until confirmed
            if (selected[oIndex]) {
              delete selected[oIndex];
              btn.setAttribute('aria-pressed', 'false');
              btn.removeAttribute('data-state');
            } else {
              selected[oIndex] = true;
              btn.setAttribute('aria-pressed', 'true');
              btn.setAttribute('data-state', 'chosen');
            }

            if (!showFeedback) {
              var any = Object.keys(selected).length > 0;
              if (any) markAnswered(qIndex);
              else delete answered[qIndex];
              updateProgress();
            }
          });
        });

        body.appendChild(optionsEl);

        if (type === 'multiple' && showFeedback) {
          var multiActions = document.createElement('div');
          multiActions.className = 'lms-question__actions';
          var checkBtn = document.createElement('button');
          checkBtn.type = 'button';
          checkBtn.className = 'lms-button lms-button--primary';
          checkBtn.textContent = 'Check answer';
          checkBtn.addEventListener('click', function () {
            if (locked) return;
            var picked = Object.keys(selected).map(Number);
            if (!picked.length) {
              setFeedback(feedback, false, 'Select an option', 'Please choose at least one answer.');
              return;
            }
            locked = true;
            var ok = isChoiceCorrect(question, picked);
            markAnswered(qIndex);
            lockOptions(optionButtons, picked, correctIndexes);
            checkBtn.disabled = true;

            if (ok === null) {
              setFeedback(feedback, true, 'Answer recorded', 'Your selection has been saved.');
            } else if (ok) {
              setFeedback(feedback, true, 'Correct', 'Well done — you selected the right option(s).');
            } else {
              setFeedback(feedback, false, 'Not quite', 'Review the highlighted option(s) and remember them for next time.');
            }
          });
          multiActions.appendChild(checkBtn);
          body.appendChild(multiActions);
        }

        body.appendChild(feedback);
      }

      listEl.appendChild(shell.section);
    });

    updateProgress();
  })();
  </script>
</div>
