<div class="lmsbox-interactive-block" data-block-id="{{BLOCK_ID}}" data-block-type="cards" role="region" aria-label="Information cards">

  <div class="{{GRID_CLASS}}">
    {{CARDS_HTML}}
  </div>

  <script>
  (function () {
    var root = document.querySelector('.lmsbox-interactive-block[data-block-type="cards"][data-block-id="{{BLOCK_ID}}"]');
    if (!root || root.getAttribute('data-cards-ready') === '1') return;
    root.setAttribute('data-cards-ready', '1');

    var blockId = root.getAttribute('data-block-id');
    var completed = false;

    function notifyComplete() {
      if (completed) return;
      completed = true;
      var payload = { type: 'interactive-block-complete', blockId: Number(blockId) };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      if (window.lmsboxInteractive && typeof window.lmsboxInteractive.notifyComplete === 'function') {
        window.lmsboxInteractive.notifyComplete(Number(blockId));
      }
    }

    // Auto-complete on view — no learner action required.
    notifyComplete();
  })();
  </script>
</div>
