<div class="lmsbox-interactive-block" data-block-id="{{BLOCK_ID}}" data-block-type="text" data-body-format="{{BODY_FORMAT}}" data-show-continue="{{SHOW_CONTINUE}}" role="region" aria-label="Lesson text">

  <div class="lmsbox-text">
    <h2 class="lmsbox-text__heading">{{HEADING}}</h2>
    <p class="lmsbox-text__subheading">{{SUBHEADING}}</p>
    <div class="lmsbox-text__body">{{BODY}}</div>
    <button type="button" class="lmsbox-text__continue" data-text-continue>Continue</button>
  </div>

  <script>
  (function () {
    var root = document.querySelector('.lmsbox-interactive-block[data-block-type="text"][data-block-id="{{BLOCK_ID}}"]');
    if (!root || root.getAttribute('data-text-ready') === '1') return;
    root.setAttribute('data-text-ready', '1');

    var blockId = root.getAttribute('data-block-id');
    var showContinue = root.getAttribute('data-show-continue') !== '0';
    var button = root.querySelector('[data-text-continue]');
    var completed = false;

    function notifyComplete() {
      if (completed) return;
      completed = true;
      if (button && showContinue) {
        button.disabled = true;
        button.textContent = 'Completed';
      }
      var payload = { type: 'interactive-block-complete', blockId: Number(blockId) };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      if (window.lmsboxInteractive && typeof window.lmsboxInteractive.notifyComplete === 'function') {
        window.lmsboxInteractive.notifyComplete(Number(blockId));
      }
    }

    if (showContinue && button) {
      button.addEventListener('click', notifyComplete);
    } else {
      notifyComplete();
    }
  })();
  </script>
</div>
