<div class="lmsbox-interactive-block" data-block-id="{{BLOCK_ID}}" data-block-type="text" data-show-continue="{{SHOW_CONTINUE}}" role="region" aria-label="Lesson text">
  <style>
    .lmsbox-interactive-block[data-block-type="text"] {
      --lmsbox-primary: #1b365d;
      --lmsbox-focus: #1b365d;
      --lmsbox-text: #0f172a;
      --lmsbox-muted: #334155;
      --lmsbox-on-primary: #ffffff;
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 1rem 0 1.25rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--lmsbox-text);
      background: transparent;
    }
    .lmsbox-interactive-block[data-block-type="text"] *,
    .lmsbox-interactive-block[data-block-type="text"] *::before,
    .lmsbox-interactive-block[data-block-type="text"] *::after {
      box-sizing: border-box;
    }
    .lmsbox-text {
      width: 100%;
      max-width: 48rem;
    }
    .lmsbox-text__heading {
      margin: 0 0 0.5rem;
      color: var(--lmsbox-primary);
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .lmsbox-text__heading:empty {
      display: none;
    }
    .lmsbox-text__subheading {
      margin: 0 0 1rem;
      color: var(--lmsbox-muted);
      font-size: 1.125rem;
      font-weight: 500;
      line-height: 1.45;
    }
    .lmsbox-text__subheading:empty {
      display: none;
    }
    .lmsbox-text__body {
      margin: 0 0 1.25rem;
      color: var(--lmsbox-text);
      font-size: 1rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .lmsbox-interactive-block[data-block-type="text"][data-show-continue="0"] .lmsbox-text__body {
      margin-bottom: 0;
    }
    .lmsbox-text__continue {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin: 0;
      padding: 0.65rem 1.25rem;
      border: none;
      border-radius: 0.375rem;
      background: var(--lmsbox-primary);
      color: var(--lmsbox-on-primary);
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .lmsbox-interactive-block[data-block-type="text"][data-show-continue="0"] .lmsbox-text__continue {
      display: none;
    }
    .lmsbox-text__continue:hover {
      filter: brightness(0.95);
    }
    .lmsbox-text__continue:focus-visible {
      outline: 3px solid var(--lmsbox-focus);
      outline-offset: 2px;
    }
    .lmsbox-text__continue[disabled] {
      opacity: 0.65;
      cursor: default;
    }
  </style>

  <div class="lmsbox-text">
    <h2 class="lmsbox-text__heading">{{HEADING}}</h2>
    <p class="lmsbox-text__subheading">{{SUBHEADING}}</p>
    <div class="lmsbox-text__body">{{BODY}}</div>
    <button type="button" class="lmsbox-text__continue" data-text-continue>Continue</button>
  </div>

  <script>
  (function () {
    var root = document.querySelector('.lmsbox-interactive-block[data-block-type="text"][data-block-id="{{BLOCK_ID}}"]');
    if (!root || root.getAttribute('data-text-ready') === '1') return;
    root.setAttribute('data-text-ready', '1');

    var blockId = root.getAttribute('data-block-id');
    var showContinue = root.getAttribute('data-show-continue') !== '0';
    var button = root.querySelector('[data-text-continue]');
    var completed = false;

    function notifyComplete() {
      if (completed) return;
      completed = true;
      if (button && showContinue) {
        button.disabled = true;
        button.textContent = 'Completed';
      }
      var payload = { type: 'interactive-block-complete', blockId: Number(blockId) };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      if (window.lmsboxInteractive && typeof window.lmsboxInteractive.notifyComplete === 'function') {
        window.lmsboxInteractive.notifyComplete(Number(blockId));
      }
    }

    if (showContinue && button) {
      button.addEventListener('click', notifyComplete);
    } else {
      // No continue button — mark complete when the block is shown.
      notifyComplete();
    }
  })();
  </script>
</div>
