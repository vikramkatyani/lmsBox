<div class="lmsbox-interactive-block" data-block-id="{{BLOCK_ID}}" data-block-type="flowchart" role="region" aria-label="Lesson flowchart">

  {{HEADING_HTML}}
  {{INTRO_HTML}}
  {{HINT_HTML}}
  <div class="lms-flowchart" data-flowchart>
    <ol class="lms-flowchart__track">{{NODES_HTML}}</ol>
    <div class="lms-flowchart__detail" data-flowchart-detail>
      <p class="lms-caption lms-flowchart__progress" data-flowchart-progress aria-live="polite"></p>
      {{PANELS_HTML}}
    </div>
  </div>

  <script>
  (function () {
    var root = document.querySelector('.lmsbox-interactive-block[data-block-type="flowchart"][data-block-id="{{BLOCK_ID}}"]');
    if (!root || root.getAttribute('data-flowchart-ready') === '1') return;
    root.setAttribute('data-flowchart-ready', '1');

    var blockId = root.getAttribute('data-block-id');
    var nodes = Array.prototype.slice.call(root.querySelectorAll('[data-flowchart-node]'));
    var panels = Array.prototype.slice.call(root.querySelectorAll('[data-flowchart-panel]'));
    var progressEl = root.querySelector('[data-flowchart-progress]');
    if (nodes.length === 0) return;

    var opened = {};
    var completed = false;

    function notifyComplete() {
      if (completed) return;
      completed = true;
      var payload = { type: 'interactive-block-complete', blockId: Number(blockId) };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      if (window.lmsboxInteractive && typeof window.lmsboxInteractive.notifyComplete === 'function') {
        window.lmsboxInteractive.notifyComplete(Number(blockId));
      }
    }

    function updateProgress() {
      var count = 0;
      for (var i = 0; i < nodes.length; i++) if (opened[i]) count++;
      if (progressEl) progressEl.textContent = count + ' of ' + nodes.length + ' stages opened';
      if (count === nodes.length) notifyComplete();
    }

    function selectNode(index) {
      opened[index] = true;
      nodes.forEach(function (node, i) {
        var on = i === index;
        node.classList.toggle('is-on', on);
        var button = node.querySelector('button');
        if (button) button.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      panels.forEach(function (panel, i) {
        var on = i === index;
        panel.hidden = !on;
        panel.classList.toggle('is-on', on);
      });
      updateProgress();
    }

    nodes.forEach(function (node, index) {
      var button = node.querySelector('button');
      if (!button) return;
      button.addEventListener('click', function () {
        selectNode(index);
      });
    });

    selectNode(0);
  })();
  </script>
</div>
