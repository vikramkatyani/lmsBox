<div class="lmsbox-interactive-block" data-block-id="{{BLOCK_ID}}" data-block-type="flowchart" role="region" aria-label="Lesson flowchart">

  {{HEADING_HTML}}
  {{INTRO_HTML}}
  {{HINT_HTML}}
  <div class="lms-flowchart" data-flowchart>
    <p class="lms-caption lms-flowchart__progress" data-flowchart-progress aria-live="polite"></p>
    <ol class="lms-flowchart__track">{{NODES_HTML}}</ol>
  </div>

  <script>
  (function () {
    var root = document.querySelector('.lmsbox-interactive-block[data-block-type="flowchart"][data-block-id="{{BLOCK_ID}}"]');
    if (!root || root.getAttribute('data-flowchart-ready') === '1') return;
    root.setAttribute('data-flowchart-ready', '1');

    var blockId = root.getAttribute('data-block-id');
    var steps = Array.prototype.slice.call(root.querySelectorAll('[data-flowchart-node]'));
    var progressEl = root.querySelector('[data-flowchart-progress]');
    if (steps.length === 0) return;

    var revealed = 1;
    var completed = false;

    function notifyComplete() {
      if (completed) return;
      completed = true;
      var payload = { type: 'interactive-block-complete', blockId: Number(blockId) };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      if (window.lmsboxInteractive && typeof window.lmsboxInteractive.notifyComplete === 'function') {
        window.lmsboxInteractive.notifyComplete(Number(blockId));
      }
    }

    function render() {
      steps.forEach(function (step, index) {
        var open = index < revealed;
        var latest = open && index === revealed - 1;
        step.hidden = !open;
        step.classList.toggle('is-open', open);
        step.classList.toggle('is-latest', latest);
        step.classList.toggle('is-on', latest);
        var next = step.querySelector('[data-flowchart-next]');
        if (next) next.hidden = !(latest && revealed < steps.length);
      });
      if (progressEl) progressEl.textContent = revealed + ' of ' + steps.length + ' stages opened';
      if (revealed === steps.length) notifyComplete();
    }

    steps.forEach(function (step) {
      var next = step.querySelector('[data-flowchart-next]');
      if (!next) return;
      next.addEventListener('click', function () {
        if (revealed >= steps.length) return;
        revealed += 1;
        render();
      });
    });

    render();
  })();
  </script>
</div>
