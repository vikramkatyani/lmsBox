<div class="lmsbox-interactive-block" data-block-id="{{BLOCK_ID}}" data-block-type="reveal" role="region" aria-label="Click reveal">

  <p class="lmsbox-accordion__progress" data-reveal-progress aria-live="polite"></p>
  <div data-reveal-root>
    {{ITEMS_HTML}}
  </div>
  {{HINT_HTML}}

  <script>
  (function () {
    var root = document.querySelector('.lmsbox-interactive-block[data-block-type="reveal"][data-block-id="{{BLOCK_ID}}"]');
    if (!root || root.getAttribute('data-reveal-ready') === '1') return;
    root.setAttribute('data-reveal-ready', '1');

    var blockId = root.getAttribute('data-block-id');
    var items = Array.prototype.slice.call(root.querySelectorAll('[data-reveal-item]'));
    var progressEl = root.querySelector('[data-reveal-progress]');
    var hintEl = root.querySelector('[data-reveal-hint]');
    if (items.length === 0) return;

    var opened = {};
    var completed = false;

    function notifyComplete() {
      if (completed) return;
      completed = true;
      var payload = { type: 'interactive-block-complete', blockId: Number(blockId) };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      if (window.lmsboxInteractive && typeof window.lmsboxInteractive.notifyComplete === 'function') {
        window.lmsboxInteractive.notifyComplete(Number(blockId));
      }
    }

    function updateProgress() {
      var count = 0;
      for (var i = 0; i < items.length; i++) if (opened[i]) count++;
      if (progressEl) progressEl.textContent = count + ' of ' + items.length + ' revealed';
      if (count === items.length) notifyComplete();
    }

    items.forEach(function (item, index) {
      var trigger = item.querySelector('.lms-reveal__trigger');
      var body = item.querySelector('.lms-reveal__body');
      if (!trigger || !body) return;

      trigger.addEventListener('click', function () {
        var open = item.classList.contains('is-open');
        item.classList.toggle('is-open', !open);
        trigger.setAttribute('aria-expanded', open ? 'false' : 'true');
        body.style.maxHeight = open ? '0px' : body.scrollHeight + 'px';

        if (!open) {
          opened[index] = true;
          if (hintEl) hintEl.classList.add('is-gone');
          updateProgress();
        }
      });
    });

    window.addEventListener('resize', function () {
      items.forEach(function (item) {
        if (!item.classList.contains('is-open')) return;
        var body = item.querySelector('.lms-reveal__body');
        if (body) body.style.maxHeight = body.scrollHeight + 'px';
      });
    });

    updateProgress();
  })();
  </script>
</div>
