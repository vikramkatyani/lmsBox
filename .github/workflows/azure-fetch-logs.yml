name: Fetch Azure lmsbox logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D75E1DFC140B410BAA47A71A34C09EB7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_044ED6B8906B46B480ED81DEA9038BD7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7C3217D114154FF08D2BA652BFF740F5 }}

      - name: Download and grep BIFA seed logs
        run: |
          az webapp log download --name lmsbox --resource-group atf-prod-core-infra-rg --log-file logs.zip
          Expand-Archive logs.zip -DestinationPath logs -Force
          Get-ChildItem logs -Recurse -File | ForEach-Object {
            Select-String -Path $_.FullName -Pattern "BIFA TenantAdmin|SeedBifa|Adopting|RequestLoginLink|SQL ensure|SQL verify|Database migration" -ErrorAction SilentlyContinue
          } | Select-Object -Last 200
